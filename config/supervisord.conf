[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisor/supervisord.pid

[unix_http_server]
file=/run/supervisor/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///run/supervisor/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:sshd]
command=/usr/sbin/sshd -D -e
priority=10
autostart=true
autorestart=true

[program:xrdp-sesman]
command=/usr/sbin/xrdp-sesman --nodaemon
priority=20
autostart=true
autorestart=true

[program:xrdp]
command=/usr/sbin/xrdp --nodaemon
priority=30
autostart=true
autorestart=true

[program:kali-mcp-api]
command=/usr/bin/kali-server-mcp --ip 127.0.0.1 --port 5000
user=_mcp-kali
directory=/
priority=40
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
