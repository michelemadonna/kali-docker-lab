name: kali-lab

services:
  kali:
    build:
      context: .
      args:
        MODE: ${MODE:-full}
        DESKTOP: ${DESKTOP:-openbox}
        INSTALL_MALTEGO: ${INSTALL_MALTEGO:-false}
    image: local/kali-offsec-lab:rolling
    container_name: kali-lab
    hostname: kali-lab
    restart: unless-stopped
    init: true
    network_mode: host
    secrets:
      - authorized_keys
      - kali_password
      - postgres_password
    volumes:
      - ssh_host_keys:/etc/ssh/hostkeys
      - metasploit_data:/var/lib/postgresql/data
      - ./workspace:/home/kali/workspace
    environment:
      MODE: ${MODE:-full}
      DESKTOP: ${DESKTOP:-openbox}
      TZ: ${TZ:-Etc/UTC}
      LANG: ${LANG:-C.UTF-8}
      KALI_NETWORK_MODE: ${KALI_NETWORK_MODE:-host}
      KALI_PASSWORD_FILE: /run/secrets/kali_password
    security_opt:
      - no-new-privileges:true

secrets:
  authorized_keys:
    file: ./secrets/authorized_keys
  kali_password:
    environment: KALI_PASSWORD
  postgres_password:
    environment: POSTGRES_PASSWORD

volumes:
  metasploit_data:
  ssh_host_keys:
